
services:

  # 1. Service MongoDB
  mongodb:
    image: mongo
    container_name: mongodb
    restart: always
    volumes:
      - mern-data:/data/db
    networks:
      - mern-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. Service Express
  server:
    build: ./server
    container_name: server
    restart: always
    ports:
      - "9000:9000"
    environment:
      MONGO_URI: mongodb://mongodb:27017/mern
    networks:
      - mern-network
    depends_on:
      mongodb:
        condition: service_healthy

  # 3. Service React
  client:
    build:
      context: ./client
      args:
        REACT_APP_API_URL: http://localhost:9000
    container_name: client
    restart: always
    ports:
      - "3000:3000"
    networks:
      - mern-network
    depends_on:
      - server

# Déclaration du réseau
networks:
  mern-network:
    driver: bridge

# Déclaration du volume
volumes:
  mern-data:
